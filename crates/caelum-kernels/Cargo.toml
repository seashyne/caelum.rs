[package]
name = "caelum-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
caelum-core = { path = "../caelum-core" }
wgpu = { version = "30", optional = true, default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
pollster = { version = "1", optional = true }
