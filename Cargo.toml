[workspace]
resolver = "2"
members = [
    "crates/caelum-core",
    "crates/caelum-kernels",
    "crates/caelum-gguf",
    "crates/caelum-tokenizer",
    "crates/caelum-models",
    "crates/caelum-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
